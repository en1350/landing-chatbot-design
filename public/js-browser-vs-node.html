<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Симулятор: Браузер vs Node.js</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closebrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/matchbrackets.min.js"></script>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --panel-bg: #252526;
            --text-color: #d4d4d4;
            --accent-browser: #f0db4f;
            --accent-node: #68a063;
            --border-color: #3e3e42;
            --console-bg: #111111;
            --resizer-hover: #007acc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 8px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            font-size: 1.2rem;
            margin: 0 0 4px 0;
        }

        .subtitle {
            text-align: center;
            font-size: 0.8rem;
            color: #888;
            margin: 0 0 8px 0;
            line-height: 1.3;
        }

        .warning {
            background-color: #3d2f1f;
            border-left: 3px solid #f0db4f;
            padding: 6px 12px;
            margin: 0 auto 8px;
            max-width: 800px;
            font-size: 0.75rem;
            border-radius: 3px;
        }

        .container {
            display: flex;
            gap: 12px;
            flex: 1;
            min-height: 0;
        }

        .panel {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            background-color: var(--panel-bg);
            border-radius: 6px;
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        .panel-header {
            padding: 6px 12px;
            font-weight: bold;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .panel.browser .panel-header { background-color: var(--accent-browser); color: #333; }
        .panel.node .panel-header { background-color: var(--accent-node); color: white; }

        .info-badge {
            font-size: 0.7rem;
            font-weight: normal;
            padding: 1px 6px;
            border-radius: 8px;
            background-color: rgba(0,0,0,0.2);
        }

        .editor {
            width: 100%;
            background-color: var(--panel-bg);
            color: var(--text-color);
            border: none;
            border-bottom: 1px solid var(--border-color);
            padding: 12px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            resize: none;
            outline: none;
            box-sizing: border-box;
            flex: 2;
            min-height: 100px;
        }

        .CodeMirror {
            width: 100%;
            flex: 2;
            min-height: 100px;
            height: auto;
            box-sizing: border-box;
            background-color: var(--panel-bg) !important;
            border-bottom: 1px solid var(--border-color);
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace !important;
            font-size: 14px !important;
            line-height: 1.5;
        }
        .CodeMirror-gutters { background-color: var(--panel-bg) !important; border-right: 1px solid var(--border-color) !important; }
        .CodeMirror-linenumber { color: #858585 !important; }

        .resizer {
            height: 10px;
            background-color: var(--border-color);
            cursor: ns-resize;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.2s;
            flex-shrink: 0;
            user-select: none;
            touch-action: none;
        }

        .resizer:hover, .resizer.active { background-color: var(--resizer-hover); }

        .resizer::after {
            content: "⋯";
            color: #888;
            font-size: 14px;
            line-height: 1;
            font-weight: bold;
        }

        .controls {
            padding: 6px 12px;
            display: flex;
            gap: 8px;
            background-color: #2d2d30;
            flex-shrink: 0;
        }

        button {
            padding: 6px 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.8; }

        .btn-browser { background-color: var(--accent-browser); color: #333; }
        .btn-node { background-color: var(--accent-node); color: white; }
        .btn-clear { background-color: #444; color: white; }

        .output-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 60px;
        }

        .preview {
            display: none;
            flex: 1;
            min-height: 160px;
            width: 100%;
            border: none;
            background: #fff;
        }
        .output-container.has-preview .preview { display: block; }
        .output-container.has-preview .output { flex: none; min-height: 50px; max-height: 110px; }

        .output {
            flex: 1;
            background-color: var(--console-bg);
            color: #4ec9b0;
            padding: 10px 12px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
            border-top: 1px solid var(--border-color);
            margin: 0;
        }

        .output.error { color: #f48771; }
        .output.info { color: #9cdcfe; }

        @media (max-width: 768px) {
            body { padding: 5px; height: auto; min-height: 100vh; }
            .container { flex-direction: column; flex: none; }
            .panel { flex: none; }
            .CodeMirror { flex: none; height: 220px; font-size: 15px !important; }
            .output-container { flex: none; }
            .output { min-height: 120px; max-height: 260px; flex: none; }
            .preview { flex: none; height: 240px; }
            button { min-height: 44px; flex: 1; }
        }
    </style>
</head>
<body>

    <h1>⚡ JavaScript: Браузер vs Node.js</h1>
    <p class="subtitle">Слева: песочница браузера. Справа: эмуляция серверного API.</p>

    <div class="warning">
        ⚠️ <strong>Важно:</strong> Это учебная эмуляция. Настоящий Node.js имеет полный доступ к ОС.
    </div>

    <div class="container">
        <div class="panel browser">
            <div class="panel-header">
                <span>🌐 Браузер</span>

            <textarea id="browser-code" class="editor" spellcheck="false">

</textarea>

            <div class="resizer" data-panel="browser"></div>

            <div class="controls">
                <button id="btn-run-browser" class="btn-browser">▶ Запустить</button>
                <button class="btn-clear" data-clear="browser-output">Очистить</button>

                <iframe id="browser-preview" class="preview" title="Предпросмотр страницы" sandbox="allow-scripts allow-modals allow-forms allow-popups"></iframe>

            <div class="resizer" data-panel="node"></div>

            <div class="controls">
                <button id="btn-run-node" class="btn-node">▶ Запустить</button>
                <button class="btn-clear" data-clear="node-output">Очистить</button>
                <button class="btn-clear" onclick="resetCode('node-code')">Возврат кода</button>
            </div>
            <div class="output-container">
                <pre id="node-output" class="output">Нажмите "Запустить" для выполнения кода.</pre>
            </div>

    <script>
        const editors = {};
        ['browser-code', 'node-code'].forEach(id => {
            editors[id] = CodeMirror.fromTextArea(document.getElementById(id), {
                mode: 'javascript',
                theme: 'dracula',
                lineNumbers: true,
                autoCloseBrackets: true,
                matchBrackets: true,
                indentUnit: 4,
                tabSize: 4
            });
        });
    </script>
    <script>
        document.querySelectorAll('.resizer').forEach(resizer => {
            let isResizing = false;
            let startY = 0;
            let startHeight = 0;

            const panel = resizer.parentElement;
            const editor = panel.querySelector('.CodeMirror');

            const begin = (y) => {
                isResizing = true;
                startY = y;
                startHeight = parseInt(window.getComputedStyle(editor).height, 10);
                resizer.classList.add('active');
                document.body.style.userSelect = 'none';
                editor.style.flex = '0 0 auto';
            };

            const move = (y) => {
                if (!isResizing) return;
                const newHeight = startHeight + (y - startY);
                const isMobile = window.matchMedia('(max-width: 768px)').matches;
                let maxHeight;
                if (isMobile) {
                    maxHeight = 700;
                } else {
                    const headerHeight = panel.querySelector('.panel-header').offsetHeight;
                    const controlsHeight = panel.querySelector('.controls').offsetHeight;
                    maxHeight = panel.clientHeight - headerHeight - controlsHeight - 60 - 10;
                }
                if (newHeight > 80 && newHeight < maxHeight) {
                    editor.style.height = newHeight + 'px';
                    editor.CodeMirror.refresh();
                }
            };

            const end = () => {
                if (!isResizing) return;
                isResizing = false;
                resizer.classList.remove('active');
                document.body.style.userSelect = 'auto';
            };

            resizer.addEventListener('mousedown', (e) => { begin(e.clientY); e.preventDefault(); });
            document.addEventListener('mousemove', (e) => move(e.clientY));
            document.addEventListener('mouseup', end);

            resizer.addEventListener('touchstart', (e) => begin(e.touches[0].clientY), { passive: true });
            document.addEventListener('touchmove', (e) => { if (isResizing) move(e.touches[0].clientY); }, { passive: true });
            document.addEventListener('touchend', end);
        });

        const NodeEmulator = {
            _files: {
                'hello.txt': 'Привет из виртуальной файловой системы Node.js!',
                'data.json': '{"users": ["Анна", "Борис", "Вика"]}',
                'config.ini': '[settings]\ntheme=dark\nlanguage=ru'
            },
            _cwd: '/home/user/project',

            fs: {
                readFileSync(path, encoding = 'utf-8') {
                    const filename = path.split('/').pop();
                    if (NodeEmulator._files[filename] !== undefined) return NodeEmulator._files[filename];
                    throw new Error(`ENOENT: no such file or directory, open '${path}'`);
                },
                writeFileSync(path, data, encoding = 'utf-8') {
                    const filename = path.split('/').pop();
                    NodeEmulator._files[filename] = data;
                    console.log(`💾 Файл '${filename}' записан (${data.length} байт)`);
                },
                readdirSync() { return Object.keys(NodeEmulator._files); },
                existsSync(path) {
                    const filename = path.split('/').pop();
                    return NodeEmulator._files[filename] !== undefined;
                }
            },

            path: {
                join(...parts) { return parts.join('/').replace(/\/+/g, '/'); },
                basename(path) { return path.split('/').pop(); }
            },

            process: {
                version: 'v20.10.0 (эмуляция)',
                platform: 'win32',
                arch: 'x64',
                cwd() { return NodeEmulator._cwd; },
                env: { NODE_ENV: 'development', USER: 'developer' },
                pid: 12345
            }
        };

        function makeDialogs(logs, quiet) {
            let used = false;
            const fmt = (a) => typeof a === 'object' ? JSON.stringify(a, null, 2) : String(a);
            const ask = (fn, args) => {
                try { return fn.apply(window, args); } catch (e) { return undefined; }
            };
            return {
                used: () => used,
                raw: function(message, defaultValue) {
                    const res = ask(window.prompt, [String(message), defaultValue === undefined ? "" : String(defaultValue)]);
                    return res === undefined ? null : res;
                },
                alert: function(...args) {
                    used = true;
                    logs.push((quiet ? "" : "🔔 alert: ") + args.map(fmt).join(' '));
                },
                prompt: function(message, defaultValue) {
                    used = true;
                    const q = message === undefined ? "" : String(message);
                    const res = ask(window.prompt, [q, defaultValue === undefined ? "" : String(defaultValue)]);
                    const value = res === undefined ? null : res;
                    logs.push("⌨️ prompt: " + q + " → " + (value === null ? "отмена (null)" : JSON.stringify(value)));
                    return value;
                },
                confirm: function(message) {
                    used = true;
                    const q = message === undefined ? "" : String(message);
                    const res = ask(window.confirm, [q]);
                    const value = res === true;
                    logs.push("❓ confirm: " + q + " → " + (value ? "OK (true)" : "Отмена (false)"));
                    return value;
                }
            };
        }

        function nodeRequire(moduleName) {
            if (moduleName === 'fs') return NodeEmulator.fs;
            if (moduleName === 'path') return NodeEmulator.path;
            if (moduleName === 'process') return NodeEmulator.process;
            throw new Error(`Cannot find module '${moduleName}'`);
        }

        function makeNodeRuntime(logs, dlg) {
            const tasks = [];
            const out = (t) => {
                const text = String(t);
                logs.push(text.endsWith('\n') ? text.slice(0, -1) : text);
                return true;
            };
            const proc = Object.assign({}, NodeEmulator.process, { stdin: {}, stdout: { write: out }, stderr: { write: out } });
            let readlineUsed = false;

            function createInterface() {
                readlineUsed = true;
                const handlers = {};
                let closed = false;
                let promptText = '> ';
                let promptCalled = false;
                let loopScheduled = false;
                const emit = (ev, ...args) => (handlers[ev] || []).slice().forEach((h) => h(...args));
                const finishOnCancel = (shown) => {
                    logs.push(shown + '(ввод отменён)');
                    rl.close();
                };
                const readLoop = () => {
                    if (closed || promptCalled) return;
                    const res = dlg.raw('Введите строку (Отмена — завершить ввод):');
                    if (res === null) { rl.close(); return; }
                    logs.push(res);
                    emit('line', res);
                    tasks.push(readLoop);
                };
                const rl = {
                    question(q, a2, a3) {
                        const callback = typeof a2 === 'function' ? a2 : a3;
                        const text = String(q);
                        tasks.push(() => {
                            if (closed) return;
                            const res = dlg.raw(text);
                            if (res === null) { finishOnCancel(text); return; }
                            logs.push(text + res);
                            if (callback) callback(res);
                        });
                    },
                    setPrompt(t) { promptText = String(t); },
                    getPrompt() { return promptText; },
                    prompt() {
                        promptCalled = true;
                        tasks.push(() => {
                            if (closed) return;
                            const res = dlg.raw(promptText);
                            if (res === null) { finishOnCancel(promptText); return; }
                            logs.push(promptText + res);
                            emit('line', res);
                        });
                    },
                    on(ev, handler) {
                        (handlers[ev] = handlers[ev] || []).push(handler);
                        if (ev === 'line' && !loopScheduled) {
                            loopScheduled = true;
                            tasks.push(readLoop);
                        }
                        return rl;
                    },
                    write(t) { out(t); },
                    pause() { return rl; },
                    resume() { return rl; },
                    close() {
                        if (closed) return;
                        closed = true;
                        emit('close');
                    }
                };
                rl.once = rl.on;
                rl.addListener = rl.on;
                return rl;
            }

            const readline = { createInterface };

            return {
                process: proc,
                require(name) {
                    if (name === 'readline') return readline;
                    if (name === 'process') return proc;
                    return nodeRequire(name);
                },
                drain() {
                    let guard = 0;
                    while (tasks.length) {
                        if (++guard > 200) {
                            logs.push("⚠️ Слишком много запросов ввода подряд — выполнение остановлено.");
                            break;
                        }
                        tasks.shift()();
                    }
                },
                used: () => readlineUsed
            };
        }



        const previewFrame = document.getElementById('browser-preview');
        const browserOutput = document.getElementById('browser-output');
        const browserOutputBox = browserOutput.parentElement;
        let previewLogs = [];

        const BRIDGE = '<script>(function(){var send=function(t,a){try{parent.postMessage({__sim:1,type:t,text:Array.prototype.map.call(a,function(x){try{return typeof x==="object"?JSON.stringify(x,null,2):String(x)}catch(e){return String(x)}}).join(" ")},"*")}catch(e){}};["log","error","info","warn"].forEach(function(m){var o=console[m];console[m]=function(){send(m,arguments);o.apply(console,arguments)}});window.addEventListener("error",function(e){send("exception",[e.message])})})();<\/script>';

        function looksLikeHtml(code) {
            return /^\s*(<!doctype|<html|<head|<body|<[a-z][\w-]*[\s>\/])/i.test(code);
        }

        function hidePreview() {
            browserOutputBox.classList.remove('has-preview');
            previewFrame.srcdoc = '';
        }

        function renderPrefix(type) {
            if (type === 'error' || type === 'exception') return '❌ ';
            if (type === 'warn') return '⚠️ ';
            if (type === 'info') return 'ℹ️ ';
            return '';
        }

        window.addEventListener('message', (e) => {
            const d = e.data;
            if (!d || !d.__sim || e.source !== previewFrame.contentWindow) return;
            previewLogs.push(renderPrefix(d.type) + d.text);
            browserOutput.innerText = previewLogs.join('\n');
            browserOutput.classList.toggle('error', d.type === 'exception');
        });

        function runHtml(code) {
            previewLogs = [];
            browserOutput.classList.remove('error', 'info');
            browserOutput.innerText = 'Страница запущена. Вывод console появится здесь.';
            browserOutputBox.classList.add('has-preview');
            previewFrame.srcdoc = BRIDGE + code;
        }

        document.querySelectorAll('.btn-clear').forEach(btn => {
            if (btn.getAttribute('data-clear') === 'browser-output') btn.addEventListener('click', hidePreview);
        });


        function resetCode(id) {
            var ta = document.getElementById(id);
            var ed = ta && ta.nextSibling && ta.nextSibling.CodeMirror;
            if (!ed) return;
            ed.setValue(ta.defaultValue.replace(/^\n/, ''));
            ed.focus();
        }

        function runCode(codeElementId, outputElementId, environment) {
            const code = editors[codeElementId].getValue();
            if (environment === 'browser' && looksLikeHtml(code)) { runHtml(code); return; }
            if (environment === 'browser') hidePreview();
            const output = document.getElementById(outputElementId);
            output.innerText = "";
            output.classList.remove('error', 'info');

            const logs = [];
            const originalLog = console.log;
            const originalError = console.error;
            const originalInfo = console.info;

            console.log = function(...args) {
                logs.push(args.map(a => typeof a === 'object' ? JSON.stringify(a, null, 2) : String(a)).join(' '));
                originalLog.apply(console, args);
            };
            console.error = function(...args) {
                logs.push("❌ " + args.map(a => String(a)).join(' '));
                originalError.apply(console, args);
            };
            console.info = function(...args) {
                logs.push("ℹ️ " + args.map(a => String(a)).join(' '));
                originalInfo.apply(console, args);
            };

            try {
                if (environment === 'browser') {
                    const d = makeDialogs(logs, false);
                    const func = new Function('alert', 'prompt', 'confirm', code);
                    const result = func(d.alert, d.prompt, d.confirm);
                    if (result !== undefined) logs.push("=> " + (typeof result === 'object' ? JSON.stringify(result, null, 2) : String(result)));
                } else if (environment === 'node') {
                    const d = makeDialogs(logs, true);
                    const wrappedCode = `
                        const require = __nodeRequire;
                        const process = __nodeProcess;
                        const alert = __dlg.alert;
                        const prompt = __dlg.prompt;
                        const confirm = __dlg.confirm;
                        ${code}
                    `;
                    const rt = makeNodeRuntime(logs, d);
                    const func = new Function('__nodeRequire', '__nodeProcess', '__dlg', wrappedCode);
                    const result = func(rt.require, rt.process, d);
                    rt.drain();
                    if (d.used()) logs.push("ℹ️ В настоящем Node.js функций alert, prompt и confirm нет — там используют console.log и модуль readline. Здесь они работают для удобства.");
                    if (rt.used()) logs.push("ℹ️ Модуль readline эмулирован: каждый вопрос показывается в окошке для ввода, а «Отмена» завершает ввод.");
                    if (result !== undefined) logs.push("=> " + (typeof result === 'object' ? JSON.stringify(result, null, 2) : String(result)));
                }
                output.innerText = logs.join('\n') || "Код выполнен (нет вывода в консоль)";
            } catch (err) {
                output.innerText = logs.join('\n') + "\n\n💥 Ошибка выполнения:\n" + err.message;
                output.classList.add('error');
            } finally {
                console.log = originalLog;
                console.error = originalError;
                console.info = originalInfo;
            }
        }

        document.getElementById('btn-run-browser').addEventListener('click', () => runCode('browser-code', 'browser-output', 'browser'));
        document.getElementById('btn-run-node').addEventListener('click', () => runCode('node-code', 'node-output', 'node'));
        document.querySelectorAll('.btn-clear').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var out = document.getElementById(btn.getAttribute('data-clear'));
                if (!out) return;
                out.textContent = '';
                out.classList.remove('error', 'info');
            });
        });
    </script>
</body>
</html>
