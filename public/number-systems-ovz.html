<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Информатика: Системы счисления | Инклюзивный интерактивный урок</title>
    <style>
        :root {
            --bg-main: #ffffff;
            --bg-card: #f8f9fa;
            --text-main: #111111;
            --text-muted: #495057;
            --primary: #0056b3;
            --primary-hover: #004494;
            --success: #006400;
            --error: #b30000;
            --border: #ced4da;
            --focus-ring: #0056b3;
            --field-bg: #ffffff;
            --font-main: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: "Courier New", Courier, monospace;
            --transition-speed: 0.3s;
        }

        html.a11y-contrast {
            --bg-main: #000000 !important;
            --bg-card: #000000 !important;
            --field-bg: #000000 !important;
            --text-main: #FFFF00 !important;
            --text-muted: #FFFFFF !important;
            --primary: #FFFF00 !important;
            --primary-hover: #FFFF00 !important;
            --success: #00FF00 !important;
            --error: #FF6666 !important;
            --border: #FFFFFF !important;
            --focus-ring: #FFFFFF !important;
        }
        html.a11y-contrast .certificate {
            background-color: #000 !important;
            border-color: #FFFF00 !important;
            color: #FFFF00 !important;
        }
        html.a11y-contrast .cert-title,
        html.a11y-contrast .cert-name { color: #FFF !important; }
        html.a11y-contrast .option-btn,
        html.a11y-contrast .btn-secondary,
        html.a11y-contrast .btn-icon { background-color: #000 !important; color: #FFF !important; border-color: #FFF !important; }
        html.a11y-contrast .option-btn.correct { background-color: #000 !important; color: #00FF00 !important; border-color: #00FF00 !important; }
        html.a11y-contrast .option-btn.wrong { background-color: #000 !important; color: #FF6666 !important; border-color: #FF6666 !important; }
        html.a11y-contrast .feedback.success,
        html.a11y-contrast .feedback.error,
        html.a11y-contrast .error-box { background-color: #000 !important; }
        html.a11y-contrast .btn-primary { color: #000 !important; }
        html.a11y-contrast .sim-result { background-color: #000 !important; color: #FFFF00 !important; }
        html.a11y-contrast .a11y-toggle-btn { color: #000 !important; }

        html.a11y-dyslexia {
            --font-main: 'OpenDyslexic', 'Comic Sans MS', 'Verdana', sans-serif !important;
        }
        html.a11y-dyslexia body {
            line-height: 1.8 !important;
            letter-spacing: 0.05em !important;
            word-spacing: 0.15em !important;
        }
        html.a11y-dyslexia p,
        html.a11y-dyslexia button,
        html.a11y-dyslexia input,
        html.a11y-dyslexia .option-btn {
            text-align: left !important;
        }

        html.a11y-large-text {
            font-size: 20px !important;
        }

        html.a11y-reduce-motion *,
        html.a11y-reduce-motion *::before,
        html.a11y-reduce-motion *::after {
            animation: none !important;
            transition: none !important;
        }

        * { box-sizing: border-box; }

        body {
            font-family: var(--font-main);
            font-size: 1.125rem;
            line-height: 1.6;
            color: var(--text-main);
            background-color: var(--bg-main);
            margin: 0;
            padding: 0;
            transition: background-color var(--transition-speed), color var(--transition-speed);
        }

        *:focus-visible {
            outline: 4px solid var(--focus-ring);
            outline-offset: 3px;
        }

        .a11y-toggle-btn {
            position: fixed; bottom: 20px; right: 20px; width: 64px; height: 64px; padding: 0;
            border-radius: 50%; background-color: var(--primary); color: #fff;
            border: 3px solid var(--text-main); font-size: 32px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4); z-index: 9999;
            display: flex; align-items: center; justify-content: center;
        }
        .a11y-toggle-btn:hover { transform: scale(1.1); }

        .a11y-panel {
            position: fixed; bottom: 95px; right: 20px; width: 340px; max-width: calc(100% - 40px);
            background-color: var(--bg-card); border: 3px solid var(--border);
            border-radius: 12px; padding: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            z-index: 9999; display: none;
        }
        .a11y-panel.open { display: block; }
        .a11y-panel h3 { margin-top: 0; font-size: 1.3rem; border-bottom: 2px solid var(--border); padding-bottom: 10px; }

        .a11y-option {
            display: flex; align-items: center; gap: 12px; margin-bottom: 15px;
            padding: 10px; border-radius: 8px; cursor: pointer; border: 2px solid transparent;
        }
        .a11y-option:hover { background-color: rgba(128,128,128,0.1); }
        .a11y-option input[type="checkbox"] {
            width: 24px; height: 24px; cursor: pointer; margin: 0; accent-color: var(--primary);
        }
        .a11y-option label { font-size: 1.1rem; font-weight: bold; cursor: pointer; margin: 0; flex: 1; }

        header {
            background-color: var(--bg-card); border-bottom: 3px solid var(--border);
            padding: 20px 5%; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 15px;
        }
        h1 { font-size: 1.5rem; margin: 0; color: var(--primary); }

        .progress-container { display: flex; align-items: center; gap: 15px; font-weight: bold; }
        .progress-bar {
            width: 200px; height: 24px; background-color: var(--border);
            border-radius: 12px; overflow: hidden; border: 2px solid var(--text-main);
        }
        .progress-fill {
            height: 100%; background-color: var(--primary); width: 0%;
            transition: width var(--transition-speed) ease;
        }

        main { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
        .card {
            background-color: var(--bg-card); border: 3px solid var(--border);
            border-radius: 12px; padding: 30px; margin-bottom: 30px;
        }
        h2 { font-size: 1.8rem; margin-top: 0; color: var(--primary); border-bottom: 3px solid var(--border); padding-bottom: 10px; }
        h3 { font-size: 1.4rem; margin-top: 25px; color: var(--text-main); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        p { margin-bottom: 15px; }

        button {
            font-family: inherit; font-size: 1.1rem; font-weight: bold;
            padding: 14px 28px; border-radius: 8px; border: 3px solid transparent;
            cursor: pointer; transition: all 0.2s; min-height: 56px;
        }
        .btn-primary { background-color: var(--primary); color: #fff; border-color: var(--primary); }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-secondary { background-color: #fff; color: var(--text-main); border-color: var(--text-main); }
        .btn-icon { padding: 8px; min-height: 44px; min-width: 44px; font-size: 1.2rem; background: none; border: 2px solid var(--border); border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; color: var(--text-main); }

        input, select {
            font-family: inherit; font-size: 1.2rem; padding: 14px;
            border: 3px solid var(--text-main); border-radius: 8px;
            background-color: var(--field-bg); color: var(--text-main);
            width: 100%; max-width: 400px; margin-bottom: 15px;
        }
        label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 1.2rem; }

        .simulator-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin: 20px 0; }
        .sim-result {
            background-color: #fff; border: 3px solid var(--primary); padding: 20px;
            border-radius: 8px; font-family: var(--font-mono); font-size: 1.5rem;
            text-align: center; margin-top: 20px; word-break: break-all; color: var(--text-main);
        }

        .option-btn {
            display: block; width: 100%; text-align: left; background-color: #fff;
            border: 3px solid var(--border); color: var(--text-main);
            padding: 18px 20px; margin-bottom: 12px; border-radius: 8px; font-size: 1.1rem;
        }
        .option-btn:hover:not(:disabled) { border-color: var(--primary); background-color: rgba(0,86,179,0.05); }
        .option-btn.correct { border-color: var(--success); background-color: #e6f4ea; color: var(--success); font-weight: bold; }
        .option-btn.wrong { border-color: var(--error); background-color: #fce8e6; color: var(--error); }
        .option-btn:disabled { cursor: not-allowed; opacity: 0.9; }

        .feedback {
            margin-top: 20px; padding: 20px; border-radius: 8px;
            border-left: 8px solid; display: none; font-size: 1.1rem;
        }
        .feedback.success { background-color: #e6f4ea; border-color: var(--success); color: var(--success); }
        .feedback.error { background-color: #fce8e6; border-color: var(--error); color: var(--error); }
        .feedback strong { color: var(--text-main); }
        html.a11y-contrast .feedback strong { color: #fff; }

        .error-box { margin-bottom: 20px; padding: 15px; background: #fce8e6; border-radius: 8px; border-left: 6px solid var(--error); }

        .certificate {
            background-color: #111; color: #00ff41; border: 4px solid #00ff41;
            padding: 40px; border-radius: 12px; font-family: var(--font-mono);
            text-align: center; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .cert-header { font-size: 1rem; letter-spacing: 2px; opacity: 0.8; margin-bottom: 10px; }
        .cert-title { font-size: 2.5rem; font-weight: bold; margin: 10px 0; color: white; }
        .cert-name {
            font-size: 2rem; border-bottom: 2px dashed #00ff41; display: inline-block;
            padding: 0 20px 5px; margin: 20px 0; color: white; max-width: 100%; word-break: break-word;
        }
        .cert-grade { font-size: 5rem; font-weight: bold; margin: 20px 0; }
        .cert-footer { display: flex; justify-content: space-between; margin-top: 40px; font-size: 0.9rem; opacity: 0.7; flex-wrap: wrap; gap: 10px; }

        @media (max-width: 600px) {
            body { font-size: 1rem; }
            .card { padding: 20px; }
            h2 { font-size: 1.5rem; }
            .progress-bar { width: 120px; }
            .cert-title { font-size: 1.8rem; }
        }

        @media print {
            body * { visibility: hidden; }
            #certificate-section, #certificate-section * { visibility: visible; }
            #certificate-section { position: absolute; left: 0; top: 0; width: 100%; border: none; box-shadow: none; }
            .no-print, .a11y-toggle-btn, .a11y-panel { display: none !important; }
        }
    </style>
</head>
<body>

<button class="a11y-toggle-btn" onclick="toggleA11yPanel()" aria-label="Открыть настройки доступности" title="Настройки доступности">⚙️</button>

<div class="a11y-panel" id="a11yPanel" role="dialog" aria-labelledby="a11y-title">
    <h3 id="a11y-title">⚙️ Настройки доступности</h3>

    <div class="a11y-option">
        <input type="checkbox" id="chk-large-text" onchange="applyA11y('large-text', this.checked)">
        <label for="chk-large-text">🔍 Крупный текст</label>
    </div>
    <div class="a11y-option">
        <input type="checkbox" id="chk-contrast" onchange="applyA11y('contrast', this.checked)">
        <label for="chk-contrast">🌗 Высокий контраст</label>
    </div>
    <div class="a11y-option">
        <input type="checkbox" id="chk-dyslexia" onchange="applyA11y('dyslexia', this.checked)">
        <label for="chk-dyslexia">🔤 Шрифт для дислексии</label>
    </div>
    <div class="a11y-option">
        <input type="checkbox" id="chk-reduce-motion" onchange="applyA11y('reduce-motion', this.checked)">
        <label for="chk-reduce-motion">🛑 Отключить анимации</label>
    </div>
    <div class="a11y-option">
        <input type="checkbox" id="chk-tts" onchange="applyA11y('tts', this.checked)">
        <label for="chk-tts">🔊 Озвучивать текст</label>
    </div>

    <button class="btn-secondary" style="width: 100%; margin-top: 10px;" onclick="resetA11y()">Сбросить настройки</button>
</div>

<header>
    <h1>Информатика: Системы счисления</h1>
    <div class="progress-container" aria-label="Прогресс прохождения урока">
        <span id="progress-text">Прогресс: 0%</span>
        <div class="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
    </div>
</header>

<main id="app-container"></main>

<script>
    const theoryData = [
        { title: "1. Что такое система счисления?", text: "Система счисления — это способ записи чисел с помощью специальных знаков (цифр). Мы привыкли к десятичной системе (основание 10), где используются цифры от 0 до 9. Компьютеры используют двоичную систему (основание 2), где есть только 0 и 1." },
        { title: "2. Двоичная система (Основание 2)", text: "Используются цифры: 0, 1. Пример: Число 5 в десятичной системе = 101 в двоичной. Почему 101? (1×4) + (0×2) + (1×1) = 5." },
        { title: "3. Восьмеричная (8) и Шестнадцатеричная (16)", text: "Восьмеричная: цифры от 0 до 7. Используется для сокращения длинных двоичных чисел. Шестнадцатеричная: цифры 0-9 и буквы A-F (где A=10, B=11, C=12, D=13, E=14, F=15)." },
        { title: "4. Как переводить?", text: "Из любой в 10-ю: Умножаем каждую цифру на основание системы в степени позиции (справа налево, начиная с 0) и складываем. Из 10-й в любую: Делим число на основание системы и записываем остатки от деления в обратном порядке." }
    ];

    const practiceData = [
        { q: "Переведите число 5 из десятичной системы в двоичную.", options: ["100", "101", "110", "111"], correct: 1, explanation: "5 = 4 + 1 = 1×2² + 0×2¹ + 1×2⁰ = 101." },
        { q: "Переведите двоичное число 110 в десятичную систему.", options: ["4", "5", "6", "7"], correct: 2, explanation: "1×4 + 1×2 + 0×1 = 6." },
        { q: "Переведите число 10 из десятичной системы в восьмеричную.", options: ["10", "12", "14", "8"], correct: 1, explanation: "10 делим на 8. Получаем 1 (остаток 2). Читаем снизу вверх: 12." },
        { q: "Переведите восьмеричное число 17 в десятичную систему.", options: ["15", "16", "17", "18"], correct: 0, explanation: "1×8 + 7×1 = 15." },
        { q: "Переведите число 255 из десятичной системы в шестнадцатеричную.", options: ["FF", "FE", "EF", "100"], correct: 0, explanation: "255 = 15×16 + 15. 15 в 16-ричной это F. Получаем FF." },
        { q: "Переведите шестнадцатеричное число A3 в десятичную систему.", options: ["160", "163", "173", "103"], correct: 1, explanation: "A=10. 10×16 + 3×1 = 160 + 3 = 163." },
        { q: "Переведите двоичное число 11010110 в шестнадцатеричную систему.", options: ["D6", "C6", "B6", "E6"], correct: 0, explanation: "1101 = 13 (D), 0110 = 6. Получаем D6." },
        { q: "Сложите в двоичной системе: 101 + 10.", options: ["110", "111", "1001", "1010"], correct: 1, explanation: "101 (5) + 010 (2) = 111 (7)." }
    ];

    const testData = [
        { q: "Какое основание у двоичной системы счисления?", options: ["1", "2", "8", "10"], correct: 1, explanation: "Двоичная система использует две цифры (0 и 1), поэтому её основание равно 2." },
        { q: "Какая цифра отсутствует в восьмеричной системе счисления?", options: ["0", "7", "8", "9"], correct: 2, explanation: "В восьмеричной системе используются цифры от 0 до 7. Цифры 8 и 9 там нет." },
        { q: "Чему равно число 10 в двоичной системе в десятичном выражении?", options: ["1", "2", "10", "4"], correct: 1, explanation: "1×2¹ + 0×2⁰ = 2 + 0 = 2." },
        { q: "Какая буква в шестнадцатеричной системе обозначает число 15?", options: ["A", "B", "E", "F"], correct: 3, explanation: "A=10, B=11, C=12, D=13, E=14, F=15." },
        { q: "Почему компьютеры используют двоичную систему?", options: ["Так исторически сложилось", "Ее легче учить", "Электронные схемы имеют два устойчивых состояния", "Она самая короткая"], correct: 2, explanation: "Аппаратно проще всего реализовать два состояния: есть ток (1) и нет тока (0)." }
    ];

    let state = {
        step: 'intro',
        userName: 'Студент',
        practiceIdx: 0,
        testIdx: 0,
        score: 0,
        maxScore: 13,
        answers: [],
        a11y: { 'large-text': false, 'contrast': false, 'dyslexia': false, 'reduce-motion': false, 'tts': false }
    };

    const app = document.getElementById('app-container');
    const htmlEl = document.documentElement;

    function esc(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function toggleA11yPanel() {
        const panel = document.getElementById('a11yPanel');
        panel.classList.toggle('open');
        const isOpen = panel.classList.contains('open');
        panel.setAttribute('aria-hidden', String(!isOpen));
        if (isOpen) document.getElementById('chk-large-text').focus();
    }

    function applyA11y(setting, isChecked) {
        state.a11y[setting] = isChecked;
        htmlEl.classList.toggle('a11y-' + setting, isChecked);
        if (setting === 'tts' && !isChecked && window.speechSynthesis) window.speechSynthesis.cancel();
        try { localStorage.setItem('a11ySettings', JSON.stringify(state.a11y)); } catch (e) {}
    }

    function loadA11ySettings() {
        try {
            const saved = localStorage.getItem('a11ySettings');
            if (saved) {
                const parsed = JSON.parse(saved);
                for (const key of Object.keys(state.a11y)) {
                    if (parsed[key]) {
                        state.a11y[key] = true;
                        htmlEl.classList.add('a11y-' + key);
                        const checkbox = document.getElementById('chk-' + key);
                        if (checkbox) checkbox.checked = true;
                    }
                }
            }
        } catch (e) {}
    }

    function resetA11y() {
        for (const key of Object.keys(state.a11y)) {
            state.a11y[key] = false;
            htmlEl.classList.remove('a11y-' + key);
            const checkbox = document.getElementById('chk-' + key);
            if (checkbox) checkbox.checked = false;
        }
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        try { localStorage.removeItem('a11ySettings'); } catch (e) {}
    }

    function speakText(text) {
        if (!state.a11y.tts || !window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ru-RU';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
    }

    function speakButton(text) {
        if (!window.speechSynthesis) return;
        const was = state.a11y.tts;
        state.a11y.tts = true;
        speakText(text);
        state.a11y.tts = was;
    }

    function speakTheory(i) { speakButton(theoryData[i].title + '. ' + theoryData[i].text); }
    function speakQuestion(type) {
        const task = type === 'practice' ? practiceData[state.practiceIdx] : testData[state.testIdx];
        speakButton(task.q + '. Варианты: ' + task.options.join(', '));
    }

    function updateProgress(percent) {
        const p = Math.round(percent);
        document.getElementById('progress-fill').style.width = p + '%';
        document.getElementById('progress-fill').parentElement.setAttribute('aria-valuenow', p);
        document.getElementById('progress-text').innerText = 'Прогресс: ' + p + '%';
    }

    function render() {
        app.innerHTML = '';
        switch (state.step) {
            case 'intro': renderIntro(); break;
            case 'theory': renderTheory(); break;
            case 'simulator': renderSimulator(); break;
            case 'practice': renderPractice(); break;
            case 'test': renderTest(); break;
            case 'results': renderResults(); break;
        }
        window.scrollTo(0, 0);
    }

    function renderIntro() {
        updateProgress(0);
        app.innerHTML = `
            <div class="card" style="text-align: center;">
                <h2>Добро пожаловать на урок!</h2>
                <p style="font-size: 1.2rem;">Тема: <b>Системы счисления</b>.</p>
                <p>Этот урок создан специально для вас. Здесь нет спешки.</p>
                <p><i>💡 Совет: Нажмите на значок ⚙️ в правом нижнем углу, чтобы настроить шрифт, контраст или включить озвучивание.</i></p>
                <div style="margin: 30px 0;">
                    <label for="nameInput">Как к вам обращаться? (Это имя будет на сертификате)</label>
                    <input type="text" id="nameInput" value="Студент">
                </div>
                <button class="btn-primary" onclick="startLesson()">Начать урок</button>
            </div>
        `;
    }

    function startLesson() {
        const name = document.getElementById('nameInput').value.trim();
        if (name) state.userName = name;
        state.step = 'theory';
        render();
    }

    function renderTheory() {
        updateProgress(15);
        let html = `<div class="card"><h2>📖 Теория</h2><p>Прочитайте краткие сведения.</p>`;
        theoryData.forEach((t, i) => {
            html += `<h3>${t.title} <button class="btn-icon" onclick="speakTheory(${i})" aria-label="Прочитать вслух" title="Прочитать вслух">🔊</button></h3><p>${t.text}</p>`;
        });
        html += `<div style="margin-top: 30px; text-align: right;">
                    <button class="btn-primary" onclick="state.step='simulator'; render();">Перейти к симулятору ➡️</button>
                 </div></div>`;
        app.innerHTML = html;
    }

    function renderSimulator() {
        updateProgress(30);
        app.innerHTML = `
            <div class="card">
                <h2>🧮 Симулятор переводов</h2>
                <p>Введите число, выберите исходную и целевую систему.</p>
                <div class="simulator-grid">
                    <div>
                        <label for="sim-input">Число:</label>
                        <input type="text" id="sim-input" placeholder="Например: 101" autocomplete="off">
                    </div>
                    <div>
                        <label for="sim-from">Из системы:</label>
                        <select id="sim-from">
                            <option value="2">Двоичная (2)</option>
                            <option value="8">Восьмеричная (8)</option>
                            <option value="10" selected>Десятичная (10)</option>
                            <option value="16">Шестнадцатеричная (16)</option>
                        </select>
                    </div>
                    <div>
                        <label for="sim-to">В систему:</label>
                        <select id="sim-to">
                            <option value="2" selected>Двоичная (2)</option>
                            <option value="8">Восьмеричная (8)</option>
                            <option value="10">Десятичная (10)</option>
                            <option value="16">Шестнадцатеричная (16)</option>
                        </select>
                    </div>
                </div>
                <button class="btn-primary" onclick="calculateSim()">Вычислить</button>
                <div id="sim-result" class="sim-result" aria-live="polite">Результат появится здесь</div>
                <div style="margin-top: 30px; text-align: right;">
                    <button class="btn-primary" onclick="state.step='practice'; state.practiceIdx=0; render();">Перейти к практике ➡️</button>
                </div>
            </div>
        `;
    }

    function calculateSim() {
        const input = document.getElementById('sim-input').value.trim().toUpperCase();
        const from = parseInt(document.getElementById('sim-from').value);
        const to = parseInt(document.getElementById('sim-to').value);
        const resultDiv = document.getElementById('sim-result');

        if (!input) {
            resultDiv.innerText = "Пожалуйста, введите число.";
            speakText("Пожалуйста, введите число.");
            return;
        }

        const digits = '0123456789ABCDEF'.slice(0, from);
        const valid = input.split('').every(ch => digits.includes(ch));

        if (!valid) {
            const errMsg = `Ошибка: в системе с основанием ${from} есть только цифры: ${digits.split('').join(' ')}.`;
            resultDiv.innerText = errMsg;
            speakText(errMsg);
        } else {
            const decimal = parseInt(input, from);
            const result = decimal.toString(to).toUpperCase();
            const successMsg = `${input} (система ${from}) = ${result} (система ${to})`;
            resultDiv.innerText = successMsg;
            speakText(`${input} из системы ${from} равно ${result} в системе ${to}`);
        }
    }

    function questionHtml(type, task, counter, nextLabel, nextFn) {
        return `
            <div class="card">
                <div style="display: flex; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
                    <span style="font-weight: bold; color: var(--primary);">${counter}</span>
                    <span>Баллы: ${state.score}</span>
                </div>
                <h3>${task.q} <button class="btn-icon" onclick="speakQuestion('${type}')" aria-label="Прочитать вопрос вслух" title="Прочитать вслух">🔊</button></h3>
                <div id="options-box">
                    ${task.options.map((opt, idx) => `
                        <button class="option-btn" onclick="checkAnswer('${type}', ${idx})">${opt}</button>
                    `).join('')}
                </div>
                <div id="feedback" class="feedback" aria-live="polite" tabindex="-1"></div>
                <div id="next-btn-container" style="margin-top: 20px; display: none; text-align: right;">
                    <button class="btn-primary" onclick="${nextFn}()">${nextLabel}</button>
                </div>
            </div>
        `;
    }

    function renderPractice() {
        updateProgress(30 + (state.practiceIdx / 8) * 40);
        const task = practiceData[state.practiceIdx];
        app.innerHTML = questionHtml('practice', task,
            `Практика: задание ${state.practiceIdx + 1} из 8`,
            state.practiceIdx === 7 ? 'Перейти к тесту ➡️' : 'Следующее задание ➡️',
            'nextPractice');
    }

    function renderTest() {
        updateProgress(75 + (state.testIdx / 5) * 20);
        const task = testData[state.testIdx];
        app.innerHTML = questionHtml('test', task,
            `Итоговый тест: вопрос ${state.testIdx + 1} из 5`,
            state.testIdx === 4 ? 'Завершить и получить оценку ➡️' : 'Следующий вопрос ➡️',
            'nextTest');
    }

    function checkAnswer(type, selectedIdx) {
        const data = type === 'practice' ? practiceData : testData;
        const idx = type === 'practice' ? state.practiceIdx : state.testIdx;
        const task = data[idx];
        const isCorrect = selectedIdx === task.correct;

        document.querySelectorAll('.option-btn').forEach((btn, i) => {
            btn.disabled = true;
            if (i === task.correct) btn.classList.add('correct');
            if (i === selectedIdx && !isCorrect) btn.classList.add('wrong');
        });

        if (isCorrect) state.score++;

        state.answers.push({
            section: type === 'practice' ? 'Практика' : 'Тест',
            question: task.q,
            userAnswer: task.options[selectedIdx],
            correctAnswer: task.options[task.correct],
            isCorrect: isCorrect,
            explanation: task.explanation
        });

        const feedback = document.getElementById('feedback');
        feedback.style.display = 'block';
        let feedbackText = "";

        if (isCorrect) {
            feedback.className = 'feedback success';
            feedback.innerHTML = `<strong>✅ Верно!</strong><br>${task.explanation}`;
            feedbackText = "Верно! " + task.explanation;
        } else {
            feedback.className = 'feedback error';
            feedback.innerHTML = `<strong>❌ Не совсем так.</strong><br>Правильный ответ: <b>${task.options[task.correct]}</b>.<br>${task.explanation}`;
            feedbackText = "Не совсем так. Правильный ответ: " + task.options[task.correct] + ". " + task.explanation;
        }

        speakText(feedbackText);
        document.getElementById('next-btn-container').style.display = 'block';
        feedback.focus();
    }

    function nextPractice() {
        if (state.practiceIdx < 7) {
            state.practiceIdx++;
        } else {
            state.step = 'test';
            state.testIdx = 0;
        }
        render();
    }

    function nextTest() {
        if (state.testIdx < 4) {
            state.testIdx++;
        } else {
            state.step = 'results';
        }
        render();
    }

    function renderResults() {
        updateProgress(100);
        const percentage = Math.round((state.score / state.maxScore) * 100);
        let grade = 2, gradeText = 'Нужно повторить материал', gradeColor = '#ff6b6b';

        if (percentage >= 90) { grade = 5; gradeText = 'Отлично'; gradeColor = '#00ff41'; }
        else if (percentage >= 70) { grade = 4; gradeText = 'Хорошо'; gradeColor = '#4dabf7'; }
        else if (percentage >= 50) { grade = 3; gradeText = 'Удовлетворительно'; gradeColor = '#ffd43b'; }

        const wrongAnswers = state.answers.filter(a => !a.isCorrect);

        app.innerHTML = `
            <div id="certificate-section" class="card">
                <div class="certificate">
                    <div class="cert-header">SYSTEM CERTIFICATE // ID: ${Math.random().toString(36).substr(2, 6).toUpperCase()}</div>
                    <div class="cert-title">СЕРТИФИКАТ</div>
                    <div style="color: #00ff41; margin-bottom: 20px;">об успешном прохождении модуля</div>
                    <div>Настоящим подтверждается, что пользователь</div>
                    <div class="cert-name">${esc(state.userName)}</div>
                    <div>изучил тему "Системы счисления"</div>
                    <div style="margin: 30px 0;">
                        <div style="font-size: 1.2rem; opacity: 0.8;">Итоговая оценка</div>
                        <div class="cert-grade" style="color: ${gradeColor}">${grade}</div>
                        <div style="font-size: 1.2rem;">${gradeText} (${state.score} из ${state.maxScore} баллов)</div>
                    </div>
                    <div class="cert-footer">
                        <div>Дата: ${new Date().toLocaleDateString('ru-RU')}</div>
                        <div>Подпись: AI Tutor v1.0</div>
                    </div>
                </div>
                <div class="no-print" style="text-align: center; margin-top: 20px;">
                    <button class="btn-primary" onclick="window.print()">🖨️ Сохранить сертификат (PDF)</button>
                    <button class="btn-secondary" onclick="location.reload()" style="margin-left: 10px;">🔄 Пройти урок заново</button>
                </div>
            </div>

            ${wrongAnswers.length > 0 ? `
            <div class="card no-print">
                <h2>🔍 Разбор ошибок</h2>
                <p>Не расстраивайтесь! Ошибки — это часть обучения.</p>
                ${wrongAnswers.map(a => `
                    <div class="error-box">
                        <strong style="color: var(--error);">[${a.section}]</strong> ${a.question}<br>
                        <span>Ваш ответ:</span> <span style="text-decoration: line-through;">${a.userAnswer}</span><br>
                        <span style="color: var(--success);">Правильный ответ:</span> <b>${a.correctAnswer}</b><br>
                        <em style="display: block; margin-top: 10px;">💡 Объяснение: ${a.explanation}</em>
                    </div>
                `).join('')}
            </div>
            ` : `
            <div class="card no-print">
                <h2 style="color: var(--success);">🎉 Поздравляем!</h2>
                <p>Вы ответили правильно на все вопросы. Вы отлично усвоили тему!</p>
            </div>
            `}
        `;

        speakText(`Урок завершен. Ваша итоговая оценка: ${grade}. ${gradeText}`);
    }

    loadA11ySettings();
    render();
</script>

</body>
</html>
